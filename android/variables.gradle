ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // @capacitor-firebase/authentication only bundles its native Google
    // Sign-In libraries (play-services-auth, credentials, googleid) when this
    // is true — without it sign-in fails at runtime with generic-looking
    // errors ("provider not enabled", "[16] Account reauth failed", "10:")
    // no matter how correct every other setting is. Found the hard way on
    // retail-pos; keep it on.
    rgcfaIncludeGoogle = true
    androidxCredentialsVersion = '1.3.0'
}