<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B3A29" />
    <meta name="description" content="Kasir Rakyat — aplikasi kasir untuk resto, warung, dan toko. Ringan, fleksibel, tanpa biaya database tambahan." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>Kasir Rakyat — Aplikasi Kasir Untuk Semua</title>
    <!-- Automatic crash reporting to the App Builder (see ai-app-builder/templates/shared/bug-reporter).
         A plain script BEFORE the bundle so even a bundle that fails to load gets reported.
         Bump "version" on every release: a fixed bug that returns is then recognised as a regression. -->
    <script src="/bug-reporter.js"></script>
    <script>
      BugReporter.init({ appId: "kasir-rakyat", key: "a9a01181c4b3672db0c843986617537c", version: "1.1.0" });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
